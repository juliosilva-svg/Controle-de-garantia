<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Frota — Garantias e Preventivas (demonstração)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #e9edf0; --surface: #ffffff; --ink: #1f2a33; --ink2: #4f5b65; --line: #c9d1d8; --line-soft: #dde3e8;
  --header: #1f2a33; --plate: #1e4fa3; --link: #1e4fa3;
  --green: #217a47; --green-bg: #e3f1e8;
  --amber: #9a6410; --amber-dot: #e0a321; --amber-bg: #fbf0d9;
  --red: #b42318; --red-bg: #fbe4e1;
  --track: #e9edf0; --row-hover: #f3f6f8;
  --sans: "Barlow", system-ui, "Segoe UI", sans-serif;
  --cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181d; --surface: #1a2229; --ink: #e5eaee; --ink2: #9eabb6; --line: #2e3a44; --line-soft: #26313a;
    --header: #0d1216; --plate: #3d6fc4; --link: #7fa7e8;
    --green: #5cc48a; --green-bg: #183326; --amber: #e8b54d; --amber-dot: #e0a321; --amber-bg: #3a2d12;
    --red: #f07a6e; --red-bg: #3d1d1a; --track: #26313a; --row-hover: #212b33; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12181d; --surface: #1a2229; --ink: #e5eaee; --ink2: #9eabb6; --line: #2e3a44; --line-soft: #26313a;
  --header: #0d1216; --plate: #3d6fc4; --link: #7fa7e8;
  --green: #5cc48a; --green-bg: #183326; --amber: #e8b54d; --amber-dot: #e0a321; --amber-bg: #3a2d12;
  --red: #f07a6e; --red-bg: #3d1d1a; --track: #26313a; --row-hover: #212b33; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
.num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Cabeçalho */
header.topo { background: var(--header); color: #fff; border-bottom: 4px solid #1e4fa3; }
.topo .in { max-width: 1400px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.marca { font: 700 26px/1 var(--cond); letter-spacing: .01em; }
.sub { color: rgba(255,255,255,.7); font-size: 14px; }
.demo { font-size: 12px; background: #e0a321; color: #1f2a33; padding: 2px 8px; border-radius: 2px; font-weight: 600; }
.topo .dir { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.topo label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.topo select { background: var(--header); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 2px; padding: 6px 8px; min-width: 210px; }
.usuario { font-size: 14px; line-height: 1.2; text-align: right; }
.usuario span { color: rgba(255,255,255,.7); display: block; }

main { max-width: 1400px; margin: 0 auto; padding: 22px 20px 40px; }

/* Indicadores */
.metricas { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--line); }
.metrica { padding: 16px 20px; border-left: 1px solid var(--line); min-width: 0; }
.metrica:first-child { border-left: 0; }
.metrica .v { font: 700 46px/1 var(--cond); }
.metrica .t { font-weight: 600; margin-top: 4px; }
.metrica .d { font-size: 14px; color: var(--ink2); }
.v.ambar { color: var(--amber); } .v.vermelho { color: var(--red); }
@media (max-width: 900px) {
  .metricas { grid-template-columns: 1fr 1fr; }
  .metrica:nth-child(3) { border-left: 0; }
  .metrica:nth-child(n+3) { border-top: 1px solid var(--line); }
}

.aviso { margin: 18px 0; border-left: 4px solid var(--amber-dot); background: var(--amber-bg); padding: 8px 14px; font-size: 14px; }

/* Filtros */
.filtros { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 2px; cursor: pointer; font-size: 14px; }
.chip:hover { border-color: var(--ink2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .n { opacity: .7; margin-left: 4px; }
.busca { margin-left: auto; display: flex; flex-direction: column; font-size: 14px; }
.busca span { color: var(--ink2); margin-bottom: 4px; }
.busca input { width: 290px; max-width: 100%; border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: 2px; }
@media (max-width: 700px) { .busca { margin-left: 0; width: 100%; } .busca input { width: 100%; } }

/* Tabela */
.quadro { background: var(--surface); border: 1px solid var(--line); }
.rolagem { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
.grade { min-width: 1080px; }
.grade th { text-align: left; font-size: 13px; font-weight: 600; color: var(--ink2); padding: 9px 12px; background: var(--row-hover); border-bottom: 1px solid var(--line); white-space: nowrap; }
.grade th button { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; color: inherit; }
.grade th button[aria-current="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.grade td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.grade tbody tr { cursor: pointer; }
.grade tbody tr:hover { background: var(--row-hover); }
.grade tbody tr:last-child td { border-bottom: 0; }
.prefixo { font: 700 19px/1.1 var(--cond); color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; }
.prefixo:hover { text-decoration: underline; }
.peq { font-size: 12px; color: var(--ink2); }
.mod { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 290px; }
.mod b { font-weight: 500; } .mod i { font-style: normal; color: var(--ink2); }
.dir-num { text-align: right; white-space: nowrap; }
.paginacao { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink2); }
.paginacao button { border: 1px solid var(--line); background: var(--surface); padding: 4px 12px; border-radius: 2px; cursor: pointer; margin-left: 6px; }
.paginacao button:disabled { opacity: .4; cursor: default; }
.vazio { padding: 40px 20px; text-align: center; color: var(--ink2); }

/* Sinalizadores */
.sinal { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.sinal::before { content: ""; width: 10px; height: 10px; border-radius: 50%; flex: none; background: currentColor; }
.s-verde { color: var(--green); } .s-amarelo { color: var(--amber); } .s-amarelo::before { background: var(--amber-dot); }
.s-vermelho { color: var(--red); } .s-neutro { color: var(--ink2); }

/* Placas */
.placa { display: inline-flex; flex-direction: column; min-width: 6rem; border: 1px solid #1f2a33; border-radius: 3px; background: #fff; overflow: hidden; text-align: center; }
.placa .faixa { background: #1e4fa3; color: #fff; font: 600 7px/9px var(--sans); letter-spacing: .2em; }
.placa .txt { font: 600 15px/1.25 var(--cond); letter-spacing: .08em; color: #1f2a33; padding: 0 6px; }
.placa.antiga { background: #d9dcdf; flex-direction: row; justify-content: center; border-color: #4f5b65; }
.placa.grande { min-width: 8.6rem; } .placa.grande .txt { font-size: 23px; } .placa.grande .faixa { font-size: 8px; line-height: 11px; }

/* Ficha (painel lateral) */
.veu { position: fixed; inset: 0; background: rgba(15,20,25,.45); display: none; z-index: 20; }
.veu.aberto { display: block; }
.ficha { position: fixed; top: 0; right: 0; bottom: 0; width: min(1080px, 100%); background: var(--bg); overflow-y: auto; z-index: 21; transform: translateX(100%); visibility: hidden; transition: transform .22s ease-out, visibility 0s linear .22s; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.ficha.aberta { transform: none; visibility: visible; transition: transform .22s ease-out; }
.ficha .barra-topo { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; background: var(--header); color: #fff; padding: 10px 20px; }
.ficha .barra-topo button { background: none; border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 2px; padding: 5px 12px; cursor: pointer; }
.ficha .corpo { padding: 18px 20px 30px; display: grid; gap: 16px; }
.cartao { background: var(--surface); border: 1px solid var(--line); }
.cartao > h3 { margin: 0; font: 600 21px/1.2 var(--cond); padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.cartao > h3 small { font: 400 13px var(--sans); color: var(--ink2); }
.cartao .cont { padding: 4px 20px 10px; }
.cabeca { display: grid; grid-template-columns: 1fr auto; gap: 20px; padding: 20px; }
.cabeca h2 { margin: 0; font: 700 64px/0.95 var(--cond); letter-spacing: -.01em; }
.linha-id { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.dados { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px 28px; margin: 16px 0 0; font-size: 14px; }
.dados dt { color: var(--ink2); } .dados dd { margin: 0; font-weight: 500; }
.dados .largo { grid-column: span 2; }
.odometro { border-left: 1px solid var(--line); padding-left: 24px; min-width: 250px; }
.odometro .v { font: 700 52px/1.05 var(--cond); }
.odometro .v small { font-size: 26px; color: var(--ink2); margin-left: 4px; }
.etiqueta { display: inline-block; margin-left: 8px; font-size: 12px; background: var(--amber-bg); color: var(--amber); padding: 1px 6px; border-radius: 2px; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.pilha { display: grid; gap: 16px; }
@media (max-width: 860px) {
  .cabeca { grid-template-columns: 1fr; } .odometro { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 14px; }
  .dados { grid-template-columns: 1fr 1fr; } .duas { grid-template-columns: 1fr; } .cabeca h2 { font-size: 52px; }
}
.item { padding: 14px 0; border-top: 1px solid var(--line-soft); }
.item:first-child { border-top: 0; }
.item header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.item h4 { margin: 0; font-size: 15px; font-weight: 600; }
.medidas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; }
@media (max-width: 560px) { .medidas { grid-template-columns: 1fr; } }
.medida .rot { font-size: 14px; margin-bottom: 6px; } .medida .rot b { font-weight: 500; }
.trilha { position: relative; height: 10px; background: var(--track); border-radius: 2px; }
.trilha .ench { height: 100%; border-radius: 2px; }
.trilha .marca { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--ink); }
.ench.verde { background: var(--green); } .ench.amarelo { background: var(--amber-dot); } .ench.vermelho { background: var(--red); }
.escala { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--ink2); margin-top: 4px; }
.escala b { color: var(--ink); font-weight: 600; }
.nota { font-size: 12px; color: var(--ink2); margin: 8px 0 0; }
.nota.ambar { color: var(--amber); font-size: 14px; }
.semlim { font-size: 14px; color: var(--ink2); margin: 0; align-self: center; }

.grafico { width: 100%; height: 240px; display: block; }
.grafico text { font: 12px var(--sans); fill: var(--ink2); }
.hist { min-width: 760px; font-size: 14px; }
.hist th { position: sticky; top: 0; background: var(--row-hover); text-align: left; font-size: 13px; color: var(--ink2); font-weight: 600; padding: 8px 12px; }
.hist td { padding: 7px 12px; border-top: 1px solid var(--line-soft); }
.hist tr.manual td { background: var(--amber-bg); }
.hist tr td:first-child { border-left: 4px solid transparent; }
.hist tr.manual td:first-child { border-left-color: var(--amber-dot); }
.hist .recusada { color: var(--red); text-decoration: line-through; }
.origem { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 2px 8px; border-radius: 2px; white-space: nowrap; }
.origem.auto { background: var(--track); color: var(--link); }
.origem.man { background: var(--amber-dot); color: #1f2a33; }
.caixa-hist { max-height: 440px; overflow: auto; border: 1px solid var(--line); }
.legenda { display: flex; gap: 16px; font-size: 13px; color: var(--ink2); margin: 2px 0 8px; flex-wrap: wrap; }
.legenda i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<header class="topo">
  <div class="in">
    <div class="marca">Controle de Frota</div>
    <div class="sub">Garantias e preventivas</div>
    <span class="demo" title="Todos os veículos, placas e quilometragens desta página são inventados">Dados fictícios</span>
    <div class="dir">
      <label>Filial
        <select id="filial"><option value="">Todas as filiais</option></select>
      </label>
      <div class="usuario">Administrador<span>Visão consolidada</span></div>
    </div>
  </div>
</header>

<main>
  <section class="metricas" id="metricas" aria-label="Indicadores da frota"></section>
  <p class="aviso" id="aviso"></p>

  <div class="filtros">
    <div class="chips" id="chips" role="group" aria-label="Situação"></div>
    <label class="busca"><span>Buscar por prefixo, placa ou modelo</span>
      <input id="busca" type="search" placeholder="Ex.: F2550 ou TYX1J01" autocomplete="off">
    </label>
  </div>

  <div class="quadro">
    <div class="rolagem">
      <table class="grade">
        <thead><tr>
          <th><button data-ordem="prefixo">Prefixo</button></th>
          <th>Placa</th>
          <th style="width:23%">Chassi</th>
          <th style="width:21%">Carroceria</th>
          <th><button data-ordem="preventiva">Preventiva</button></th>
          <th class="dir-num"><button data-ordem="km">KM atual</button></th>
          <th><button data-ordem="vencimento">Próximo vencimento</button></th>
        </tr></thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
    <nav class="paginacao" aria-label="Paginação">
      <span id="pag-info"></span>
      <span><button id="pag-ant">Anterior</button><button id="pag-prox">Próxima</button></span>
    </nav>
  </div>
</main>

<div class="veu" id="veu"></div>
<aside class="ficha" id="ficha" role="dialog" aria-modal="true" aria-label="Ficha do veículo" tabindex="-1">
  <div class="barra-topo"><strong id="ficha-titulo">Ficha do veículo</strong><button id="fechar">Fechar</button></div>
  <div class="corpo" id="ficha-corpo"></div>
</aside>

<script>
"use strict";
/* ------------------------------------------------------------------ dados fictícios */
function aleatorio(semente) { return () => { semente |= 0; semente = semente + 0x6D2B79F5 | 0; let t = Math.imul(semente ^ semente >>> 15, 1 | semente); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = aleatorio(20261007);
const escolher = (a) => a[Math.floor(rnd() * a.length)];
const entre = (a, b) => a + rnd() * (b - a);
const DIA = 86400000;
const HOJE = new Date(); HOJE.setHours(0, 0, 0, 0);
const addMeses = (d, m) => { const r = new Date(d); r.setMonth(r.getMonth() + m); r.setDate(r.getDate() - 1); return r; };
const nf = new Intl.NumberFormat("pt-BR");
const fmtKm = (v) => v == null ? "—" : `${nf.format(v)} km`;
const fmtData = (d) => d ? d.toLocaleDateString("pt-BR") : "—";

const FILIAIS = ["Complexo Minas Centrais", "Complexo Mariana", "Linhas MG", "Usiminas", "Mineração Itatiaiuçu", "Cenibra", "Bemisa", "ADM Central MG"];
// tipo de operação: letra do prefixo, KM/dia típico e combinações de chassi/carroceria
const TIPOS = [
  { letra: "F", kmDia: 210, peso: 34, combos: [["Mercedes-Benz", "OF-1724L/59", "Comil", "Campione 3.25"], ["Mercedes-Benz", "OF-1721/59 Euro VI", "Busscar", "El Buss FT"], ["Mercedes-Benz", "OF-1621/59 Euro VI", "Comil", "Versatile"], ["Mercedes-Benz", "OF-1721/59", "Marcopolo", "Viaggio 900"]] },
  { letra: "U", kmDia: 180, peso: 28, combos: [["Mercedes-Benz", "OF-1721/59", "Comil", "Svelto U"], ["Mercedes-Benz", "OF-1721/59", "Marcopolo", "Torino U"], ["Mercedes-Benz", "OF-1721/59", "Neobus", "Mega U"]] },
  { letra: "M", kmDia: 160, peso: 26, combos: [["Mercedes-Benz", "LO-916 Euro VI", "Comil", "Piá Rodoviário"], ["Mercedes-Benz", "LO-916", "Marcopolo", "Senior"], ["Agrale", "MA 8.7", "Marcopolo", "Volare Attack 8"], ["Mercedes-Benz", "OF-1519R/60 Euro VI", "Caio", "Foz Super"]] },
  { letra: "R", kmDia: 300, peso: 8, combos: [["Mercedes-Benz", "O-500 R 1931 Euro VI", "Comil", "Campione Invictus 1050"], ["Mercedes-Benz", "O-500 RS 1836", "Busscar", "Vissta Buss 360"]] },
  { letra: "V", kmDia: 140, peso: 4, combos: [["Mercedes-Benz", "Sprinter 417 CDI", null, null], ["Toyota", "Hiace", null, null]] },
];
const REGRAS = {
  CHASSI: [{ comp: "Chassi — garantia geral", meses: 12 }, { comp: "Trem de força", meses: 24, km: 200000 }],
  CARROCERIA: [{ comp: "Carroceria — garantia geral", meses: 12 }, { comp: "Estrutura da carroceria", meses: 60 }],
};
const PLANOS = [
  { nome: "Revisão 10.000 km", intervalo: 10000, tol: 500, ant: 1000 },
  { nome: "Revisão 50.000 km", intervalo: 50000, tol: 1000, ant: 3000 },
  { nome: "Óleo do câmbio (Mercedes-Benz)", intervalo: 100000, tol: 2000, ant: 5000, fab: "Mercedes-Benz" },
];
const LETRAS = "ABCDEFGHJKLMNPRSTUVWXYZ";

function gerarPlaca(antiga) {
  const l = () => escolher(LETRAS), n = () => Math.floor(rnd() * 10);
  return antiga ? `${l()}${l()}${l()}${n()}${n()}${n()}${n()}` : `${escolher("QRST")}${l()}${l()}${n()}${escolher(LETRAS)}${n()}${n()}`;
}
function gerarChassi(fab) {
  const base = fab === "Toyota" ? "8AJ" : fab === "Agrale" ? "93P" : "9BM";
  let s = base; while (s.length < 17) s += escolher("ABCDEFGHJKLMNPRSTUVWXYZ0123456789"); return s;
}

/* ------------------------------------------------------------------ regras (mesmas do backend) */
function avaliarGarantia(g, km, mediaDia) {
  const diasTempo = g.fim ? Math.floor((g.fim - HOJE) / DIA) : null;
  const kmRest = g.kmLimite != null ? g.kmLimite - km : null;
  if (kmRest != null && kmRest <= 0) return { status: "EXPIRADA", motivo: "KM", dias: 0, diasTempo, kmRest };
  if (diasTempo != null && diasTempo < 0) return { status: "EXPIRADA", motivo: "TEMPO", dias: diasTempo, diasTempo, kmRest };
  const diasKm = kmRest != null && mediaDia ? Math.floor(kmRest / mediaDia) : null;
  const cand = [[diasTempo, "TEMPO"], [diasKm, "KM"]].filter((c) => c[0] != null).sort((a, b) => a[0] - b[0]);
  if (!cand.length) return { status: "ATIVA", motivo: null, dias: null, diasTempo, kmRest };
  const [dias, motivo] = cand[0];
  const status = dias <= 30 ? "VENCE_30" : dias <= 60 ? "VENCE_60" : "ATIVA";
  return { status, motivo, dias, diasTempo, kmRest, fimEstimado: new Date(HOJE.getTime() + dias * DIA) };
}
function avaliarPlano(p, km, ultima) {
  const base = ultima ?? 0, proxima = base + p.intervalo, rest = proxima - km;
  const status = rest < -p.tol ? "VENCIDA" : rest <= 0 ? "NECESSARIA" : rest <= p.ant ? "PROXIMA" : "EM_DIA";
  return { ...p, ultima, base, proxima, rest, status };
}
const PRIO_G = ["VENCE_30", "VENCE_60", "ATIVA", "EXPIRADA"];
const PRIO_P = ["VENCIDA", "NECESSARIA", "PROXIMA", "EM_DIA"];
const resumo = (lista, prio) => prio.find((s) => lista.some((x) => x.status === s)) ?? null;

/* ------------------------------------------------------------------ geração da frota */
const frota = [];
const usados = new Set();
let seq = { F: 200, U: 100, M: 1000, R: 10, V: 5 };
for (let i = 0; i < 186; i++) {
  let alvo = rnd() * 100, tipo = TIPOS[0];
  for (const t of TIPOS) { alvo -= t.peso; if (alvo <= 0) { tipo = t; break; } }
  const [fab, modelo, enc, modCar] = escolher(tipo.combos);
  // idade: maioria da frota de 2019–2021, renovação recente em 2025–2026
  const idadeDias = Math.floor(rnd() < 0.42 ? entre(20, 720) : entre(720, 2900));
  const inicio = new Date(HOJE.getTime() - idadeDias * DIA);
  const ano = inicio.getFullYear();
  seq[tipo.letra] += Math.ceil(entre(1, 3)) * 10;
  const prefixo = `${tipo.letra}${String(seq[tipo.letra]).padStart(4, "0")}`;
  let placa; do { placa = gerarPlaca(ano < 2018 && rnd() < 0.7); } while (usados.has(placa)); usados.add(placa);
  const kmDia = tipo.kmDia * entre(0.7, 1.35);
  const kmAtual = Math.round(idadeDias * kmDia);
  const v = {
    id: i + 1, prefixo, placa, fab, modelo, enc, modCar, ano, inicio, kmDia, km: kmAtual,
    filial: tipo.letra === "R" ? escolher(["Cenibra", "Linhas MG"]) : tipo.letra === "U" ? escolher(["Linhas MG", "Usiminas"]) : escolher(FILIAIS),
    chassi: gerarChassi(fab), confirmada: rnd() > 0.25,
  };
  // histórico de 30 dias, com lançamentos manuais e algumas leituras recusadas
  const hist = []; let km = Math.max(0, kmAtual - Math.round(30 * kmDia));
  hist.push({ data: new Date(Date.now() - 31 * DIA), km, ant: null, origem: "API", detalhe: "Rastreador Sascar", ok: true });
  for (let d = 30; d >= 0; d--) {
    const passo = rnd() < 0.15 ? 0 : Math.round(kmDia * entre(0.6, 1.4));
    const ant = km; km += passo;
    const quando = new Date(Date.now() - d * DIA - Math.floor(entre(0, 5)) * 3600000);
    hist.push({ data: quando, km, ant, origem: "API", detalhe: "Rastreador Sascar", ok: true });
    if (rnd() < 0.025) hist.push({ data: new Date(quando.getTime() + 600000), km: km - Math.round(entre(500, 3000)), ant: km, origem: "API", detalhe: "Rastreador Sascar", ok: false, motivo: "KM regressivo" });
    if (rnd() < 0.03) { const a = km; km += Math.round(entre(5, 60)); hist.push({ data: new Date(quando.getTime() + 3600000), km, ant: a, origem: "MANUAL", detalhe: "Lançado na oficina (OS)", ok: true }); }
  }
  v.km = km; v.hist = hist.sort((a, b) => b.data - a.data);
  v.atualizado = hist.find((h) => h.ok).data;
  const aceitas = hist.filter((h) => h.ok).sort((a, b) => a.data - b.data);
  v.media = (aceitas.at(-1).km - aceitas[0].km) / Math.max((aceitas.at(-1).data - aceitas[0].data) / DIA, 1);
  // garantias
  v.garantias = [];
  for (const [origem, nome] of [["CHASSI", fab], ["CARROCERIA", enc]]) {
    if (!nome) continue;
    for (const r of REGRAS[origem]) {
      const g = { origem, fabricante: nome, comp: r.comp, inicio, fim: addMeses(inicio, r.meses), kmInicio: 0, kmLimite: r.km ?? null };
      Object.assign(g, avaliarGarantia(g, v.km, v.media));
      v.garantias.push(g);
    }
  }
  // preventivas
  v.prev = PLANOS.filter((p) => !p.fab || p.fab === fab).map((p) => {
    let ultima = v.km >= p.intervalo ? Math.floor(v.km / p.intervalo) * p.intervalo : null;
    if (ultima != null && p.intervalo <= 10000 && rnd() < 0.16) ultima -= p.intervalo;
    if (ultima != null && rnd() < 0.08) ultima -= Math.round(entre(0, 0.12) * p.intervalo); // revisão adiantada
    return avaliarPlano(p, v.km, ultima);
  });
  v.sChassi = resumo(v.garantias.filter((g) => g.origem === "CHASSI"), PRIO_G);
  v.sCarroc = resumo(v.garantias.filter((g) => g.origem === "CARROCERIA"), PRIO_G);
  v.sPrev = resumo(v.prev, PRIO_P);
  v.vigentes = v.garantias.filter((g) => g.status !== "EXPIRADA");
  v.critica = v.vigentes.slice().sort((a, b) => (a.dias ?? 1e9) - (b.dias ?? 1e9))[0] ?? null;
  v.prevCritica = v.prev.slice().sort((a, b) => a.rest - b.rest)[0] ?? null;
  frota.push(v);
}

/* ------------------------------------------------------------------ rótulos */
const ROT_G = { ATIVA: ["Vigente", "verde"], VENCE_60: ["Vence em até 60 dias", "amarelo"], VENCE_30: ["Vence em até 30 dias", "amarelo"], EXPIRADA: ["Expirada", "vermelho"] };
const ROT_P = { EM_DIA: ["Em dia", "verde"], PROXIMA: ["Próxima", "amarelo"], NECESSARIA: ["Necessária", "vermelho"], VENCIDA: ["Vencida", "vermelho"] };
const sinal = ([rot, tom]) => `<span class="sinal s-${tom}">${rot}</span>`;
const placaHtml = (p, grande = false) => /^[A-Z]{3}\d{4}$/.test(p)
  ? `<span class="placa antiga ${grande ? "grande" : ""}" title="Placa no padrão antigo"><span class="txt">${p.slice(0, 3)}-${p.slice(3)}</span></span>`
  : `<span class="placa ${grande ? "grande" : ""}"><span class="faixa" aria-hidden="true">BRASIL</span><span class="txt">${p}</span></span>`;
const prazo = (d) => d == null ? "sem prazo por data" : d < 0 ? `expirou há ${nf.format(-d)} dias` : d === 0 ? "vence hoje" : d === 1 ? "vence amanhã" : `vence em ${nf.format(d)} dias`;
function haQuanto(d) { const m = Math.round((Date.now() - d) / 60000); if (m < 60) return `há ${Math.max(m, 1)} min`; const h = Math.round(m / 60); return h < 48 ? `há ${h} h` : `há ${Math.round(h / 24)} dias`; }

/* ------------------------------------------------------------------ estado e filtros */
const FILTROS = {
  alerta: ["Precisam de atenção", (v) => ["VENCE_30", "VENCE_60"].includes(v.sChassi) || ["VENCE_30", "VENCE_60"].includes(v.sCarroc) || ["VENCIDA", "NECESSARIA"].includes(v.sPrev)],
  todos: ["Todos", () => true],
  vencendo: ["Garantia a vencer", (v) => ["VENCE_30", "VENCE_60"].includes(v.sChassi) || ["VENCE_30", "VENCE_60"].includes(v.sCarroc)],
  vigente: ["Com garantia vigente", (v) => v.vigentes.length > 0],
  preventiva: ["Preventiva pendente", (v) => ["VENCIDA", "NECESSARIA"].includes(v.sPrev)],
};
const estado = { filial: "", filtro: "alerta", busca: "", ordem: "vencimento", pagina: 0 };
const POR_PAGINA = 25;
const $ = (id) => document.getElementById(id);

const sel = $("filial");
FILIAIS.forEach((f) => sel.insertAdjacentHTML("beforeend", `<option>${f}</option>`));
sel.onchange = () => { estado.filial = sel.value; estado.pagina = 0; render(); };
$("busca").oninput = (e) => { estado.busca = e.target.value; estado.pagina = 0; render(); };
document.querySelectorAll("[data-ordem]").forEach((b) => b.onclick = () => { estado.ordem = b.dataset.ordem; estado.pagina = 0; render(); });
$("pag-ant").onclick = () => { estado.pagina--; render(); };
$("pag-prox").onclick = () => { estado.pagina++; render(); };

const PESO_P = { VENCIDA: 0, NECESSARIA: 1, PROXIMA: 2, EM_DIA: 3 };
const ORDENS = {
  prefixo: (a, b) => a.prefixo.localeCompare(b.prefixo, "pt-BR", { numeric: true }),
  km: (a, b) => b.km - a.km,
  vencimento: (a, b) => (a.critica?.dias ?? 1e9) - (b.critica?.dias ?? 1e9),
  preventiva: (a, b) => (PESO_P[a.sPrev ?? "EM_DIA"] - PESO_P[b.sPrev ?? "EM_DIA"]) || (a.prevCritica?.rest ?? 0) - (b.prevCritica?.rest ?? 0),
};

function render() {
  const daFilial = frota.filter((v) => !estado.filial || v.filial === estado.filial);
  // indicadores
  const temG = (v, ...s) => s.includes(v.sChassi) || s.includes(v.sCarroc);
  const m = {
    total: daFilial.length,
    v60: daFilial.filter((v) => temG(v, "VENCE_30", "VENCE_60")).length,
    v30: daFilial.filter((v) => temG(v, "VENCE_30")).length,
    sem: daFilial.filter((v) => !v.vigentes.length).length,
    prev: daFilial.filter((v) => ["VENCIDA", "NECESSARIA"].includes(v.sPrev)).length,
    prox: daFilial.filter((v) => v.sPrev === "PROXIMA").length,
    est: daFilial.filter((v) => !v.confirmada).length,
  };
  $("metricas").innerHTML = [
    [m.total, "Veículos na frota", "Ônibus, micro-ônibus e vans ativos", ""],
    [m.v60, "Garantia a vencer", `${nf.format(m.v30)} em até 30 dias, o restante em até 60`, m.v60 ? "ambar" : ""],
    [m.sem, "Sem garantia vigente", "Todas as garantias de chassi e carroceria expiradas", m.sem ? "vermelho" : ""],
    [m.prev, "Preventivas pendentes", `Necessárias ou vencidas; ${nf.format(m.prox)} próximas`, m.prev ? "vermelho" : ""],
  ].map(([v, t, d, c]) => `<div class="metrica"><div class="v num ${c}">${nf.format(v)}</div><div class="t">${t}</div><div class="d">${d}</div></div>`).join("");
  const aviso = $("aviso");
  aviso.hidden = !m.est;
  aviso.textContent = `${nf.format(m.est)} veículos estão com a data de início da garantia estimada. Confirme a data de entrega de cada um para que os prazos fiquem exatos.`;

  // chips com contagem
  $("chips").innerHTML = Object.entries(FILTROS).map(([k, [rot, f]]) =>
    `<button class="chip" data-f="${k}" aria-pressed="${estado.filtro === k}">${rot}<span class="n num">${daFilial.filter(f).length}</span></button>`).join("");
  $("chips").querySelectorAll(".chip").forEach((b) => b.onclick = () => { estado.filtro = b.dataset.f; estado.pagina = 0; render(); });

  // tabela
  const termo = estado.busca.toUpperCase().replace(/[^A-Z0-9]/g, "");
  const lista = daFilial.filter(FILTROS[estado.filtro][1])
    .filter((v) => !termo || `${v.prefixo}${v.placa}${v.modelo}${v.modCar ?? ""}`.toUpperCase().replace(/[^A-Z0-9]/g, "").includes(termo))
    .sort(ORDENS[estado.ordem]);
  document.querySelectorAll("[data-ordem]").forEach((b) => b.setAttribute("aria-current", b.dataset.ordem === estado.ordem));
  const paginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
  estado.pagina = Math.min(Math.max(estado.pagina, 0), paginas - 1);
  const ini = estado.pagina * POR_PAGINA, vis = lista.slice(ini, ini + POR_PAGINA);

  const col = (s, fab, mod) => !fab ? `<span class="peq">Monobloco</span>`
    : `<div class="mod"><b>${fab}</b> <i>${mod}</i></div>${s ? sinal(ROT_G[s]) : ""}`;
  $("linhas").innerHTML = vis.length ? vis.map((v) => `
    <tr data-id="${v.id}">
      <td><button class="prefixo" data-id="${v.id}">${v.prefixo}</button><div class="peq">${v.filial}</div></td>
      <td>${placaHtml(v.placa)}</td>
      <td>${col(v.sChassi, v.fab, `${v.modelo} ${v.ano}`)}</td>
      <td>${col(v.sCarroc, v.enc, v.modCar)}</td>
      <td>${sinal(ROT_P[v.sPrev])}<div class="peq num" style="white-space:nowrap">${v.prevCritica.rest < 0 ? `${fmtKm(-v.prevCritica.rest)} além` : `faltam ${fmtKm(v.prevCritica.rest)}`}</div></td>
      <td class="dir-num num">${fmtKm(v.km)}</td>
      <td style="font-size:14px">${v.critica ? `<div style="font-weight:500">${v.critica.comp}</div><div class="peq" style="font-size:13px">${prazo(v.critica.dias)}${v.critica.motivo === "KM" ? " pela KM" : ""}${v.confirmada ? "" : " (estimado)"}</div>` : `<span class="peq" style="font-size:14px">Nenhuma garantia vigente</span>`}</td>
    </tr>`).join("") : `<tr><td colspan="7" class="vazio">Nenhum veículo com esses filtros. Limpe a busca ou escolha outra situação.</td></tr>`;
  $("pag-info").textContent = lista.length ? `${ini + 1}–${Math.min(ini + POR_PAGINA, lista.length)} de ${lista.length}` : "0 veículos";
  $("pag-ant").disabled = estado.pagina === 0;
  $("pag-prox").disabled = estado.pagina >= paginas - 1;
  $("linhas").querySelectorAll("tr[data-id]").forEach((tr) => tr.onclick = () => abrirFicha(+tr.dataset.id));
}

/* ------------------------------------------------------------------ ficha do veículo */
function barra(fracao, tom, ini, atual, fim, rotulo) {
  const f = Math.max(0, Math.min(fracao, 1));
  return `<div class="trilha" role="meter" aria-label="${rotulo}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(f * 100)}">
    <div class="ench ${tom}" style="width:${f * 100}%"></div><div class="marca" style="left:calc(${f * 100}% - 1px)"></div></div>
    <div class="escala num"><span>${ini}</span><b>${atual}</b><span>${fim}</span></div>`;
}
function itemGarantia(g, v) {
  const [rot, tom] = ROT_G[g.status];
  const tempo = g.fim ? `<div class="medida"><div class="rot">Por tempo: <b>${prazo(g.diasTempo)}</b></div>
      ${barra((HOJE - g.inicio) / (g.fim - g.inicio), g.diasTempo < 0 ? "vermelho" : tom, fmtData(g.inicio), "hoje", fmtData(g.fim), `Prazo consumido: ${g.comp}`)}</div>`
    : `<p class="semlim">Sem limite de tempo.</p>`;
  const km = g.kmLimite != null ? `<div class="medida"><div class="rot">Por quilometragem: <b>${g.kmRest > 0 ? `faltam ${fmtKm(g.kmRest)}` : "limite atingido"}</b></div>
      ${barra((v.km - g.kmInicio) / (g.kmLimite - g.kmInicio), g.kmRest <= 0 ? "vermelho" : g.motivo === "KM" ? tom : "verde", nf.format(g.kmInicio), nf.format(v.km), fmtKm(g.kmLimite), `KM consumida: ${g.comp}`)}</div>`
    : `<p class="semlim">Sem limite de quilometragem.</p>`;
  const proj = g.status !== "EXPIRADA" && g.motivo === "KM" ? `<p class="nota ambar">No ritmo atual de uso, o limite de KM será atingido por volta de ${fmtData(g.fimEstimado)}, antes da data final.</p>` : "";
  return `<article class="item"><header><h4>${g.comp}</h4>${sinal([rot, tom])}</header><div class="medidas">${tempo}${km}</div>${proj}
    ${v.confirmada ? "" : `<p class="nota">Datas calculadas a partir de um início de garantia estimado.</p>`}</article>`;
}
function itemPreventiva(p, v) {
  const [rot, tom] = ROT_P[p.status];
  return `<article class="item"><header><h4>${p.nome}</h4>${sinal([rot, tom])}</header>
    <p style="margin:4px 0 8px;font-size:14px">Próxima em <b class="num" style="font-weight:500">${fmtKm(p.proxima)}</b>, ${p.rest >= 0 ? `faltam ${fmtKm(p.rest)}` : `${fmtKm(-p.rest)} além do previsto`}.</p>
    ${barra((v.km - p.base) / p.intervalo, tom, p.ultima != null ? `Última: ${nf.format(p.ultima)}` : `Base: ${nf.format(p.base)}`, nf.format(v.km), nf.format(p.proxima), `Intervalo consumido: ${p.nome}`)}
    ${p.ultima == null ? `<p class="nota">Sem execução registrada; o cálculo parte do KM de início da garantia.</p>` : ""}</article>`;
}
function grafico(v) {
  const pts = v.hist.filter((h) => h.ok).slice().sort((a, b) => a.data - b.data);
  const W = 900, H = 240, ml = 78, mr = 14, mt = 12, mb = 28;
  const t0 = pts[0].data.getTime(), t1 = pts.at(-1).data.getTime();
  const k0 = pts[0].km, k1 = Math.max(pts.at(-1).km, k0 + 1);
  const x = (t) => ml + (t - t0) / Math.max(t1 - t0, 1) * (W - ml - mr);
  const y = (k) => mt + (1 - (k - k0) / (k1 - k0)) * (H - mt - mb);
  const linhas = [0, .5, 1].map((f) => { const k = Math.round(k0 + f * (k1 - k0)); return `<line x1="${ml}" x2="${W - mr}" y1="${y(k)}" y2="${y(k)}" stroke="var(--line-soft)"/><text x="${ml - 8}" y="${y(k) + 4}" text-anchor="end">${nf.format(k)}</text>`; }).join("");
  const datas = [0, .25, .5, .75, 1].map((f) => { const t = t0 + f * (t1 - t0); return `<text x="${x(t)}" y="${H - 8}" text-anchor="middle">${new Date(t).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })}</text>`; }).join("");
  const caminho = pts.map((p, i) => `${i ? "L" : "M"}${x(p.data.getTime()).toFixed(1)},${y(p.km).toFixed(1)}`).join("");
  const marcas = pts.map((p) => p.origem === "MANUAL"
    ? `<rect x="${x(p.data.getTime()) - 4.5}" y="${y(p.km) - 4.5}" width="9" height="9" fill="#e0a321" stroke="var(--ink)"><title>${p.data.toLocaleString("pt-BR")}: ${fmtKm(p.km)} (manual)</title></rect>`
    : `<circle cx="${x(p.data.getTime())}" cy="${y(p.km)}" r="2.6" fill="var(--link)"><title>${p.data.toLocaleString("pt-BR")}: ${fmtKm(p.km)} (rastreador)</title></circle>`).join("");
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolução do KM nos últimos 30 dias">${linhas}${datas}<path d="${caminho}" fill="none" stroke="var(--link)" stroke-width="2" vector-effect="non-scaling-stroke"/>${marcas}</svg>`;
}
function tabelaHist(v, filtro) {
  const testes = { todas: () => true, auto: (h) => h.origem !== "MANUAL", man: (h) => h.origem === "MANUAL", rec: (h) => !h.ok };
  const rot = { todas: "Todas", auto: "Rastreador", man: "Manuais", rec: "Recusadas" };
  const linhas = v.hist.filter(testes[filtro]);
  const chips = Object.keys(testes).map((k) => `<button class="chip" data-h="${k}" aria-pressed="${filtro === k}">${rot[k]}<span class="n num">${v.hist.filter(testes[k]).length}</span></button>`).join("");
  const corpo = linhas.map((h) => {
    const man = h.origem === "MANUAL", d = h.ant != null ? h.km - h.ant : null;
    return `<tr class="${man ? "manual" : ""}"><td class="num">${h.data.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}</td>
      <td class="num dir-num ${h.ok ? "" : "recusada"}" style="${h.ok ? "font-weight:500" : ""}">${fmtKm(h.km)}</td>
      <td class="num dir-num peq" style="font-size:14px">${d == null ? "—" : `${d >= 0 ? "+" : "−"}${nf.format(Math.abs(d))}`}</td>
      <td><span class="origem ${man ? "man" : "auto"}">${man ? "&#9679; Manual" : "&#8776; Rastreador"}</span></td>
      <td class="peq" style="font-size:14px">${h.detalhe}</td>
      <td>${h.ok ? `<span class="s-verde">Aceita</span>` : `<span class="s-vermelho"><b style="font-weight:500">Recusada:</b> ${h.motivo}</span>`}</td></tr>`;
  }).join("") || `<tr><td colspan="6" class="vazio">Nenhuma leitura neste filtro.</td></tr>`;
  return `<div class="chips" style="margin:6px 0 10px" role="group" aria-label="Filtrar leituras">${chips}</div>
    <div class="caixa-hist"><table class="hist"><thead><tr><th>Data da leitura</th><th class="dir-num">Odômetro</th><th class="dir-num">Variação</th><th>Origem</th><th>Detalhe</th><th>Situação</th></tr></thead><tbody>${corpo}</tbody></table></div>`;
}

let ultimoFoco = null;
function abrirFicha(id, filtroHist = "todas") {
  const v = frota.find((x) => x.id === id);
  if (!document.querySelector(".ficha.aberta")) ultimoFoco = document.activeElement;
  $("ficha-titulo").textContent = `Ficha do veículo ${v.prefixo}`;
  const grupos = [["CHASSI", `Chassi — ${v.fab} ${v.modelo}`], ["CARROCERIA", `Carroceria — ${v.enc ?? ""} ${v.modCar ?? ""}`]]
    .map(([o, t]) => [t, v.garantias.filter((g) => g.origem === o)]).filter(([, l]) => l.length);
  const ultima = v.hist.find((h) => h.ok);
  $("ficha-corpo").innerHTML = `
    <section class="cartao cabeca">
      <div>
        <div class="linha-id"><h2>${v.prefixo}</h2>${placaHtml(v.placa, true)}</div>
        <dl class="dados">
          <div><dt>Chassi</dt><dd>${v.fab} ${v.modelo}</dd></div>
          <div><dt>Carroceria</dt><dd>${v.enc ? `${v.enc} ${v.modCar}` : "Monobloco"}</dd></div>
          <div><dt>Ano do chassi</dt><dd class="num">${v.ano}</dd></div>
          <div><dt>Filial</dt><dd>${v.filial}</dd></div>
          <div class="largo"><dt>Número do chassi (VIN)</dt><dd style="letter-spacing:.04em">${v.chassi}</dd></div>
          <div class="largo"><dt>Início da garantia</dt><dd>${fmtData(v.inicio)} com 0 km${v.confirmada ? "" : `<span class="etiqueta">data estimada</span>`}</dd></div>
        </dl>
      </div>
      <div class="odometro">
        <div class="peq" style="font-size:14px">Odômetro atual</div>
        <div class="v num">${nf.format(v.km)}<small>km</small></div>
        <div class="peq" style="font-size:14px">Atualizado ${haQuanto(ultima.data)} por <span style="color:${ultima.origem === "MANUAL" ? "var(--amber)" : "var(--link)"}">${ultima.origem === "MANUAL" ? "lançamento manual" : "rastreador"}</span></div>
        <div style="font-size:14px;margin-top:8px">Média de uso: <b class="num" style="font-weight:500">${nf.format(Math.round(v.media))} km/dia</b></div>
      </div>
    </section>
    <div class="duas">
      <div class="pilha">${grupos.map(([t, l]) => `<section class="cartao"><h3>${t}</h3><div class="cont">${l.map((g) => itemGarantia(g, v)).join("")}</div></section>`).join("")}</div>
      <section class="cartao"><h3>Manutenção preventiva</h3><div class="cont">${v.prev.map((p) => itemPreventiva(p, v)).join("")}</div></section>
    </div>
    <section class="cartao"><h3>Histórico de KM <small>Linhas em âmbar são lançamentos manuais</small></h3>
      <div class="cont" style="padding-top:12px">
        <div class="legenda"><span><i style="background:var(--link);border-radius:50%"></i>Leitura do rastreador</span><span><i style="background:#e0a321;outline:1px solid var(--ink)"></i>Lançamento manual</span></div>
        ${grafico(v)}${tabelaHist(v, filtroHist)}
      </div>
    </section>`;
  $("ficha-corpo").querySelectorAll("[data-h]").forEach((b) => b.onclick = () => {
    const topo = $("ficha").scrollTop; abrirFicha(id, b.dataset.h); $("ficha").scrollTop = topo;
  });
  $("veu").classList.add("aberto");
  $("ficha").classList.add("aberta");
  $("ficha").focus({ preventScroll: true });
  if (filtroHist === "todas") $("ficha").scrollTop = 0;
}
function fecharFicha() {
  $("veu").classList.remove("aberto"); $("ficha").classList.remove("aberta");
  if (ultimoFoco) ultimoFoco.focus();
}
$("fechar").onclick = fecharFicha;
$("veu").onclick = fecharFicha;
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("ficha").classList.contains("aberta")) fecharFicha(); });

render();
</script>
</body>
</html>
